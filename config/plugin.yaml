service:
  app_id: 10ooadcx
  name: 统一身份登录与组织同步
  description: 同步客户侧 OA 的两级组织和人员,并支持网页端 OAuth 2.0、OA 门户及客户 APP H5 token 登录 ONES(团队级插件)
  version: 1.1.0
  mode: team
  logo: null
  language: nodejs
  language_version: 16.13.0
  host_version: 1.0.4
  host_sub_version: 1.0.0
  min_system_version: 3.6.0
  auth: null
  config: null
  scope: 1
  policy:
    policy: simple
    target: ''
apis:
  - type: addition
    methods:
      - POST
    url: /config/get
    function: apiConfigGet
  - type: addition
    methods:
      - POST
    url: /config/save
    function: apiConfigSave
  - type: addition
    methods:
      - POST
    url: /config/test
    function: apiConfigTest
  - type: addition
    methods:
      - POST
    url: /sync/manual
    function: apiSyncManual
  - type: addition
    methods:
      - POST
    url: /sync/status
    function: apiSyncStatus
  - type: addition
    methods:
      - POST
    url: /h5/verify
    function: apiH5Verify
modules:
  - id: sinosure-settings
    title: 统一身份与组织同步配置
    moduleType: settings
    entry: modules/sinosure-settings/index.html
  - id: sinosure-h5-entry
    title: APP H5 登录入口
    moduleType: about:blank
    entry: modules/sinosure-h5-entry/index.html
abilities:
  - id: sinosure-account
    name: account
    version: 1.0.0
    abilityType: account
    function:
      sendMessage: SendMessage
      createLoginUrl: CreateLoginUrl
      doExchangeUser: DoExchangeUser
      doPullData: DoPullData
    config:
      - key: canLogin
        value: true
        show: false
      - key: canSync
        value: true
        show: false
      - key: canMessage
        value: false
        show: false
      - key: logo
        value: logo.svg
        show: false
      - key: title
        value: 统一身份登录
        show: false
      - key: desc
        value: 使用客户统一认证账号登录 ONES
        show: false
      - key: detailTip
        value: 跳转客户统一认证平台完成认证;首次使用请确认管理员已完成组织人员同步
        show: false
      - key: configTip
        value: 使用前请在「统一身份与组织同步配置」页完成必填配置
        show: false
storage:
  entities:
    - name: sso_state
      attributes:
        value:
          type: text
          default: ''
        updated_at:
          type: text
          default: ''
    - name: plugin_config
      attributes:
        content:
          type: text
          default: ''
        updated_at:
          type: text
          default: ''
    - name: user_email_state
      attributes:
        email:
          type: text
          default: ''
        is_virtual:
          type: boolean
          default: true
    - name: dept_state
      attributes:
        name:
          type: text
          default: ''
        parent_id:
          type: text
          default: ''
        status:
          type: text
          default: active
    - name: h5_code
      attributes:
        userid:
          type: text
          default: ''
        expires_at:
          type: text
          default: ''
    - name: sync_audit
      attributes:
        pulled_at:
          type: text
          default: ''
        dept_count:
          type: integer
          length: 8
          default: 0
        user_count:
          type: integer
          length: 8
          default: 0
        skipped_count:
          type: integer
          length: 8
          default: 0
        preserved_dept_count:
          type: integer
          length: 8
          default: 0
        trigger:
          type: text
          default: auto
        error:
          type: text
          default: ''
